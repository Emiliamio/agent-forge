services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentforge-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: agent_forge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置，请先运行 bash scripts/gen-env.sh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_forge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentforge-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置，请先运行 bash scripts/gen-env.sh}
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置，请先运行 bash scripts/gen-env.sh}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${AGENTFORGE_REGISTRY:-ghcr.io/emiliamio}/agentforge-backend:${AGENTFORGE_TAG:-1.1.1}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforge-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/system/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent_forge?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置，请先运行 bash scripts/gen-env.sh}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置，请先运行 bash scripts/gen-env.sh}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置，请先运行 bash scripts/gen-env.sh}
      AGENTFORGE_SEED_ENABLED: "false"     # 生产不注入演示种子
    ports:
      - "8080:8080"

  frontend:
    image: ${AGENTFORGE_REGISTRY:-ghcr.io/emiliamio}/agentforge-frontend:${AGENTFORGE_TAG:-1.1.1}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentforge-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${FRONTEND_PORT:-3000}:8080"

volumes:
  pgdata_prod:
  redisdata_prod:
