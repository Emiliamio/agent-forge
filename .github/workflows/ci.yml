name: AgentForge CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_NAME: agentforge
  DB_USER: postgres
  DB_PASSWORD: password123
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  REDIS_PASSWORD: redis123

jobs:
  backend-test:
    name: Backend · tests (live) + coverage + spotbugs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentforge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres -d agentforge"
          --health-interval 5s --health-timeout 3s --health-retries 5
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Redis with password
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass redis123
          for i in $(seq 1 30); do
            docker exec redis redis-cli -a redis123 ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          docker exec redis redis-cli -a redis123 ping | grep -q PONG

      - name: Prepare live test database (agentforge_it)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=password123
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE agentforge_it;"
          cd backend
          mvn -q -B flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/agentforge_it -Dflyway.user=postgres -Dflyway.password=password123
          psql -h localhost -U postgres -d agentforge_it -v ON_ERROR_STOP=1 -f src/main/resources/sql/seed-data.sql

      - name: Run tests with live channel + JaCoCo gate + SpotBugs
        working-directory: backend
        env:
          LIVE_TESTS: "true"
        run: mvn -B clean verify -Dlive=true

      - name: Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/site/jacoco/**
            backend/target/spotbugsXml.xml
          if-no-files-found: warn

  frontend-build:
    name: Frontend · lint + vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend quality gates
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  security-audit:
    name: Security · gitleaks + OSV + trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret leak gate (gitleaks)
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1 --verbose

      - name: Install OSV-Scanner
        run: |
          # v1.9.x 命令为 osv-scanner -r ./ ； v2.x 改为 osv-scanner scan source -r .
          OSV_VERSION=1.9.0
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Dependency vulnerability gate (OSV)
        run: osv-scanner -r ./

      - name: Filesystem CVE gate (trivy)
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
                    --skip-dirs node_modules --skip-dirs backend/target .

  sbom-drift:
    name: SBOM · drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: SBOM drift check
        run: |
          bash scripts/refresh-sbom.sh
          git diff --exit-code docs/sbom/ || {
            echo "[FAIL] docs/sbom 与当前依赖不一致，请运行 scripts/refresh-sbom.sh 并提交"; exit 1; }

  benchmark-drift:
    name: Benchmark · stable-metric drift check
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentforge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres -d agentforge"
          --health-interval 5s --health-timeout 3s --health-retries 5
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Redis with password
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass redis123
          for i in $(seq 1 30); do
            docker exec redis redis-cli -a redis123 ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          docker exec redis redis-cli -a redis123 ping | grep -q PONG

      - name: Boot backend
        working-directory: backend
        run: |
          nohup mvn -q -DskipTests spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/system/health | grep -q '"code":200'; then
              echo "[OK] backend up"; break
            fi
            sleep 3
          done
          curl -sf http://localhost:8080/api/system/health | grep -q '"code":200' \
            || { echo "[FAIL] backend not healthy"; tail -n 80 /tmp/backend.log; exit 1; }

      - name: Re-run benchmark and compare stable metrics
        run: |
          python3 scripts/benchmark.py --out /tmp/latest.json
          python3 scripts/check_benchmark.py \
              --baseline docs/benchmark/stable.json --current /tmp/latest.json

      - name: Benchmark doc checker self-test
        run: python3 scripts/check_benchmark_doc.py --self-test

      - name: Benchmark doc drift check
        run: |
          python3 scripts/check_benchmark_doc.py \
            --stable docs/benchmark/stable.json --doc docs/BENCHMARK.md

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-run
          path: /tmp/latest.json
          if-no-files-found: warn

  docker-e2e:
    name: Docker · full-stack build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and boot full stack via docker compose
        run: |
          docker compose --profile full up -d --build --wait

      - name: Run automated smoke suite
        run: |
          bash scripts/smoke.sh

      - name: Teardown containers
        if: always()
        run: |
          docker compose --profile full down -v

  claims-verify:
    name: Claims · reproducible claims matrix gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Boot full stack via docker compose
        run: |
          docker compose --profile full up -d --build --wait

      - name: Prepare live test database
        run: |
          bash scripts/prepare-live-db.sh

      - name: Execute claims verification matrix
        run: |
          bash scripts/verify-claims.sh

      - name: Teardown containers
        if: always()
        run: |
          docker compose --profile full down -v

  publish-images:
    name: Docker · publish images to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend-test, frontend-build, docker-e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/emiliamio/agentforge-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/emiliamio/agentforge-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/emiliamio/agentforge-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/emiliamio/agentforge-frontend:latest
