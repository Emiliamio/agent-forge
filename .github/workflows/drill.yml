name: Backup & Restore Scheduled Drill

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  drill:
    name: Backup and restore round-trip verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend jar
        run: |
          mvn -B package -DskipTests -Dspotbugs.skip=true

      - name: Start postgres and redis via docker compose
        run: |
          docker compose up -d postgres redis
          echo "Waiting for postgres to be healthy..."
          for i in {1..30}; do
            if docker exec agentforge-postgres pg_isready -U postgres -d agentforge >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            sleep 1
          done

      - name: Populate live seed data
        run: |
          bash scripts/prepare-live-db.sh

      - name: Run backup
        run: |
          bash scripts/backup.sh

      - name: Run round-trip restore verification
        run: |
          bash scripts/restore.sh --verify

      - name: Report success
        run: |
          echo "[OK] Backup and restore scheduled drill passed with 100% round-trip fidelity"
