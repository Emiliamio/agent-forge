name: Backup & Restore Scheduled Drill

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  drill:
    name: Backup, primary restore and prod compose drill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend jar
        run: |
          mvn -B package -DskipTests -Dspotbugs.skip=true

      - name: Start postgres and redis via docker compose
        run: |
          docker compose up -d postgres redis
          echo "Waiting for postgres to be healthy..."
          for i in {1..30}; do
            if docker exec agentforge-postgres pg_isready -U postgres -d agentforge >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            sleep 1
          done

      - name: Populate live seed data
        run: |
          bash scripts/prepare-live-db.sh

      - name: Run backup
        run: |
          bash scripts/backup.sh

      - name: Run round-trip restore verification (temp db)
        run: |
          bash scripts/restore.sh --verify

      - name: Start full stack for primary restore drill
        run: |
          docker compose --profile full up -d --wait

      - name: Run destructive restore to primary drill
        env:
          ALLOW_DESTRUCTIVE_RESTORE: "yes"
        run: |
          bash scripts/restore-to-primary.sh

      - name: Teardown dev stack
        run: |
          docker compose --profile full down -v

      - name: Production compose boot and smoke test
        run: |
          docker compose -f docker-compose-prod.yml up -d --build --wait
          curl -sf http://localhost:8080/api/system/health
          curl -sf http://localhost:3000/
          docker compose -f docker-compose-prod.yml down -v

      - name: Report success
        run: |
          echo "[OK] All backup, primary restore, and production compose drills passed successfully"
